version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: whatsapp-integration-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: whatsapp-integration
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - whatsapp-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: whatsapp-integration-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: whatsapp-integration-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/whatsapp-integration?authSource=admin
      REDIS_URL: redis://:redis123@redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      API_KEY_SALT: dev-api-key-salt-change-in-production
      WEBHOOK_SIGNING_SECRET: dev-webhook-secret-change-in-production
      FRONTEND_URL: http://localhost:3000
      WPP_SESSION_PATH: /app/sessions
      WPP_MAX_CLIENTS: 10
      WPP_HEADLESS: "true"
      WPP_DEVTOOLS: "false"
      LOG_LEVEL: debug
      BCRYPT_ROUNDS: 10
    volumes:
      - ./backend:/app
      - /app/node_modules
      - wpp_sessions:/app/sessions
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: whatsapp-integration-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api/v1
      VITE_SOCKET_URL: http://localhost:3001
      VITE_APP_NAME: WhatsApp Integration
      VITE_APP_VERSION: 1.0.0
      VITE_ENABLE_2FA: "true"
      VITE_ENABLE_WEBHOOKS: "true"
      VITE_ENABLE_ANALYTICS: "true"
      VITE_DEV_MODE: "true"
      VITE_LOG_LEVEL: debug
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - whatsapp-network

  # Nginx Reverse Proxy (Optional for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: whatsapp-integration-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - whatsapp-network
    profiles:
      - production

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  wpp_sessions:
    driver: local

networks:
  whatsapp-network:
    driver: bridge